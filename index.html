<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/webaruhaz.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h6">Filmek adatbázisa</span>
</nav>

<div class="container py-4">
    <h1 class="text-center fw-bold mb-3">A Legjobb Filmek Tárháza</h1>

    <input type="text" class="form-control mb-4" placeholder="Keresés"/>

    <div class="row g-3">

    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/batman.jpg" alt="Batman Begins"/>
            <div class="card-body">
                <div class="card-title">Batman Kezdődik</div>
                <div class="card-year">2005</div>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/baywatch.jpg" alt="Baywatch"/>
            <div class="card-body">
                <div class="card-title">Baywatch</div>
                <div class="card-year">2017</div>
            </div>
        </div>
    </div>
 
    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/fandf.jpg" alt="Halálos iramban 6"/>
            <div class="card-body">
                <div class="card-title">Halálos iramban 6</div>
                <div class="card-year">2013</div>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/avangers.jpg" alt="Bosszúállók"/>
            <div class="card-body">
                <div class="card-title">Bosszúállók</div>
                <div class="card-year">2012</div>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/spiderman.jpg" alt="Pókember"/>
            <div class="card-body">
                <div class="card-title">Pókember</div>
            <div class="card-year">2002</div>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="card">
            <img src="img/terminator.jpg" alt="Terminátor"/>
            <div class="card-body">
                <div class="card-title">Terminátor</div>
                <div class="card-year">1984</div>
            </div>
        </div>
    </div>

    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-4">
    <h5>§ Filmek adatbázisa §</h5>
</footer>

</body>
</html>
